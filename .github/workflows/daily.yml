name: Daily QA job feed
on:
  schedule:
    # GitHub pilnas stundas cron palaiž ar 7–8 h nobīdi, tāpēc agri un ne pilnā stundā,
    # ar 2 rezerves laikiem. Ja šodienas dati jau ir, palaidiens neko nedara.
    - cron: "23 0 * * *"   # 00:23 UTC (02:23 Rīgā)
    - cron: "47 2 * * *"   # rezerve
    - cron: "17 4 * * *"   # rezerve
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if today's data exists
        id: fresh
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && grep -q "\"generated\": \"$(date -u +%F)\"" out/insights.json; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "Šodienas dati jau ir"
          fi
      - uses: actions/setup-python@v5
        if: steps.fresh.outputs.skip != '1'
        with:
          python-version: "3.12"
      - run: python feed.py
        if: steps.fresh.outputs.skip != '1'
      - run: python linkedin.py
        if: steps.fresh.outputs.skip != '1'
      - run: python insights.py
        if: steps.fresh.outputs.skip != '1'
      - run: python companies_page.py
        if: steps.fresh.outputs.skip != '1'
      - name: Commit feed
        if: steps.fresh.outputs.skip != '1'
        run: |
          git config user.name "qa-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out/jobs.xml out/jobs.csv out/linkedin.json out/linkedin out/linkedin_used.json out/insights.json out/companies_page.json out/companies_page.html
          git diff --cached --quiet || git commit -m "Feed $(date -u +%F)"
          # Ja kāds pa to laiku iesūtīja citu commit, pārbāzē un mēģini vēlreiz (līdz 3 reizēm).
          for i in 1 2 3; do
            git pull --rebase -q -X theirs && git push && exit 0
            sleep 10
          done
          exit 1
