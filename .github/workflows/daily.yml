name: Daily QA job feed
on:
  schedule:
    - cron: "0 4 * * *"   # katru dienu 04:00 UTC (07:00 Rīgā)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python feed.py
      - run: python linkedin.py
      - name: Commit feed
        run: |
          git config user.name "qa-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out/jobs.xml out/jobs.csv out/linkedin.json out/linkedin
          git diff --cached --quiet || git commit -m "Feed $(date -u +%F)"
          git push
